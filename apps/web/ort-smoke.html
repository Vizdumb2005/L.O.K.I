<!doctype html>
<html>
<head><meta charset="utf-8"><title>ort smoke</title></head>
<body>
<pre id="log">starting</pre>
<script type="module">
import * as ort from 'onnxruntime-web';
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
try {
  ort.env.wasm.wasmPaths = '/ort/';
  ort.env.wasm.numThreads = 1;
  const segBytes = new Uint8Array(await (await fetch('/speech-models/segmentation-3-0.int8.onnx')).arrayBuffer());
  const seg = await ort.InferenceSession.create(segBytes, { executionProviders: ['wasm'] });
  const x = new ort.Tensor('float32', new Float32Array(160000), [1, 1, 160000]);
  const out = await seg.run({ x });
  log('SEG-OK ' + JSON.stringify(out[seg.outputNames[0]].dims));
  const embBytes = new Uint8Array(await (await fetch('/speech-models/wespeaker-resnet34-lm.onnx')).arrayBuffer());
  const emb = await ort.InferenceSession.create(embBytes, { executionProviders: ['wasm'] });
  const f = new ort.Tensor('float32', new Float32Array(100 * 80), [1, 100, 80]);
  const o2 = await emb.run({ feats: f });
  log('EMB-OK ' + JSON.stringify(o2[emb.outputNames[0]].dims));
  document.title = 'SMOKE-DONE';
} catch (e) {
  log('SMOKE-FAIL ' + (e && e.message ? e.message : String(e)));
  document.title = 'SMOKE-FAIL';
}
</script>
</body>
</html>
